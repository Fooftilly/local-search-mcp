# Optional opt-in drop-in for local-search-mcp-tunnel.service.
# Requires exact sudoers command for a ROOT-OWNED copy of the guard.
# The + prefix excludes only this ExecStartPre from NoNewPrivileges=true;
# the long-lived tunnel's ExecStart remains restricted.
[Service]
TimeoutStartSec=4min
ExecStartPre=+/usr/bin/sudo -n /usr/bin/python3 /usr/local/libexec/local-search-mcp/crawler_egress_guard.py --container crawl4ai --probe
