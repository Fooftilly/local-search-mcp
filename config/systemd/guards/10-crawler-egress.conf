# Optional opt-in drop-in for local-search-mcp-tunnel.service.
# Requires an exact restricted sudoers rule and a ROOT-OWNED guard.
# --tunnel-gate probes a running crawler, or verifies the preinstalled nft
# firewall when the crawler is intentionally asleep. web_fetch must still
# pass --preflight BEFORE wake and --probe AFTER wake.
# The + prefix excludes only this ExecStartPre from NoNewPrivileges=true;
# the long-lived tunnel's ExecStart remains restricted.
[Service]
TimeoutStartSec=4min
ExecStartPre=+/usr/bin/sudo -n /usr/bin/python3 /usr/local/libexec/local-search-mcp/crawler_egress_guard.py --container crawl4ai --tunnel-gate
