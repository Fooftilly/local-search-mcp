# Generated by local-search-mcp -- never a live migration.
# Review existing Crawl4AI volumes, env and image before deploying.
name: local-search-crawler
services:
  crawl4ai:
    image: ${CRAWL4AI_IMAGE:?Set a verified Crawl4AI 0.9.5+ image}
    container_name: crawl4ai
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Crawl4AI API token required}
    dns:
      - 1.1.1.1
      - 9.9.9.9
    networks:
      - crawler-egress
networks:
  crawler-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: lsm-crawler0
    enable_ipv6: false
