name: DOCX offline conversion acceptance

# This runs only when the offline converter and its harness are changed,
# or when explicitly requested by a maintainer. Not part of ordinary CI.
on:
  pull_request:
    paths:
      - '.github/workflows/docx-offline-acceptance.yml'
      - 'office_docx_admission.py'
      - 'office_docx_pilot.py'
      - 'office_docx_worker.py'
      - 'requirements-docx-pilot.txt'
      - 'scripts/docx_pilot_offline_acceptance.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docx-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-docx-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Ensure kernel seccomp library is installed
        run: |
          if ! ldconfig -p | grep -F 'libseccomp.so.2'; then
            sudo apt-get update
            sudo apt-get install -y libseccomp2
          fi
      - name: Install optional pinned DOCX dependency in a disposable environment
        run: |
          python -m venv "$RUNNER_TEMP/docx-acceptance-venv"
          "$RUNNER_TEMP/docx-acceptance-venv/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: \
            -r requirements-docx-pilot.txt
      - name: Convert generated DOCX inside real restricted worker
        id: acceptance
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          "$RUNNER_TEMP/docx-acceptance-venv/bin/python" \
            -m scripts.docx_pilot_offline_acceptance --run
      - name: Classify the isolated child failure without exposing content
        if: ${{ failure() && steps.acceptance.outcome == 'failure' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          "$RUNNER_TEMP/docx-acceptance-venv/bin/python" -B - <<'PY'
          import os
          from scripts.docx_pilot_offline_acceptance import sample_docx_bytes
          from office_docx_pilot import run_offline_docx_bytes, DocxPilotUnavailable

          try:
              result = run_offline_docx_bytes(sample_docx_bytes())
          except DocxPilotUnavailable as exc:
              # Only a fixed, trusted error enum: never print exception text.
              safe_errors = {
                  "Offline DOCX worker failed closed": "child_exit_nonzero",
                  "Offline DOCX worker exceeded wall time": "wall_timeout",
                  "Offline DOCX worker output oversized": "oversized_output",
                  "Offline DOCX worker output malformed": "invalid_output",
                  "Offline DOCX worker output invalid": "invalid_envelope",
                  "Offline DOCX worker output incomplete": "incomplete_output",
              }
              code = safe_errors.get(str(exc), "other_fail_closed")
              os.write(1, ("child_failure_category=" + code + "\n").encode())
          else:
              os.write(1, (
                  "child_failure_category=none "
                  + "truncated=" + str(result["truncated"]) + "\n"
              ).encode())
          PY
      - name: Reproduce isolated worker stages with matching subprocess constraints
        if: ${{ failure() && steps.acceptance.outcome == 'failure' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          "$RUNNER_TEMP/docx-acceptance-venv/bin/python" -B - <<'PY'
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          from scripts.docx_pilot_offline_acceptance import sample_docx_bytes

          script = '''
          import os
          import sys
          from io import BytesIO
          sys.path.insert(0, sys.argv[1])
          import office_docx_worker as worker

          stage = "resource_limits"
          try:
              worker._limits()
              stage = "early_seccomp"
              worker._deny_io(block_files=False)
              stage = "converter_initialization"
              converter, StreamInfo = worker._converter()
              stage = "final_seccomp"
              worker._deny_io(block_files=True)
              stage = "stdin"
              payload = sys.stdin.buffer.read(worker.office_docx_admission.MAX_DOCX_BYTES + 1)
              stage = "admission"
              worker.office_docx_admission.inspect_docx_container(payload)
              stage = "convert_stream"
              converted = converter.convert_stream(
                  BytesIO(payload),
                  stream_info=StreamInfo(
                      mimetype="application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                      extension=".docx",
                  ),
              )
              stage = "json_encoding"
              from json import dumps
              raw = dumps({"markdown": converted.markdown, "truncated": False},
                          ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              stage = "report"
              os.write(1, ("child_phase=completed bytes=" + str(len(raw)) + chr(10)).encode())
          except (Exception, MemoryError) as exc:
              os.write(1, ("child_phase=" + stage + " exception="
                           + type(exc).__name__ + chr(10)).encode())
          '''
          child = subprocess.Popen(
              [sys.executable, "-I", "-B", "-c", script, str(Path.cwd())],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL, cwd="/",
              env={"PYTHONDONTWRITEBYTECODE": "1",
                   "PYTHONNOUSERSITE": "1", "LC_ALL": "C.UTF-8"},
              close_fds=True, start_new_session=True,
          )
          try:
              output, _ = child.communicate(input=sample_docx_bytes(), timeout=15)
          except subprocess.TimeoutExpired:
              os.killpg(child.pid, signal.SIGKILL)
              child.communicate()
              print("child_phase=wall_timeout")
          else:
              print("child_exit_status=" + str(child.returncode))
              print(output.decode("utf-8", "replace")[:500])
          PY
      - name: Diagnose synthetic conversion stage without document output
        if: ${{ failure() && steps.acceptance.outcome == 'failure' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONNOUSERSITE: '1'
        run: |
          "$RUNNER_TEMP/docx-acceptance-venv/bin/python" -B - <<'PY'
          from io import BytesIO
          import os

          import office_docx_worker as worker
          from scripts.docx_pilot_offline_acceptance import (
              sample_docx_bytes, score_conversion,
          )

          stage = "generate_synthetic_fixture"
          try:
              payload = sample_docx_bytes()
              stage = "resource_limits"
              worker._limits()
              stage = "early_seccomp_network_lockdown"
              worker._deny_io(block_files=False)
              stage = "optional_converter_initialization"
              converter, stream_info = worker._converter()
              stage = "final_seccomp_file_lockdown"
              worker._deny_io(block_files=True)
              stage = "inspect_synthetic_archive"
              worker.office_docx_admission.inspect_docx_container(payload)
              stage = "convert_stream"
              result = converter.convert_stream(
                  BytesIO(payload),
                  stream_info=stream_info(
                      mimetype="application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                      extension=".docx",
                  ),
              )
              stage = "score_generated_fixture"
              verdict = score_conversion(result.markdown, truncated=False)
              # Boolean markers only. Do not emit converted text.
              lines = result.markdown.splitlines()
              markers = (
                  "PilotColumnOne", "PilotColumnTwo",
                  "PilotValueOne", "PilotValueTwo",
              )
              positions = [
                  (i, sum(marker in line for marker in markers), line.count("|"))
                  for i, line in enumerate(lines)
                  if any(marker in line for marker in markers)
              ]
              dividers = [
                  (i, line.count("|"))
                  for i, line in enumerate(lines)
                  if "|" in line and all(ch in " :-|\\t" for ch in line)
              ]
              # Counts and indices only, never extracted document text.
              os.write(1, (
                  "diagnostic_stage=completed "
                  + " heading=" + str(verdict["heading_markdown"])
                  + " table=" + str(verdict["table_markdown"])
                  + " unicode=" + str(verdict["unicode_preserved"])
                  + " truncated=" + str(verdict["truncated"])
                  + " line_count=" + str(len(lines))
                  + " marker_positions=" + str(positions)
                  + " divider_positions=" + str(dividers)
                  + "\n"
              ).encode())
          except (Exception, MemoryError) as exc:
              # Synthetic DOCX only; neither exception text nor document
              # content may be emitted. The first failed phase is sufficient.
              os.write(1, (
                  "diagnostic_stage=" + stage
                  + " exception_type=" + type(exc).__name__ + "\n"
              ).encode())
          PY
