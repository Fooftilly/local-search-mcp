name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libpsl
        run: sudo apt-get update && sudo apt-get install -y libpsl5
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q bootstrap.py bridge.py admin_ui.py domain_policy.py crawler_security.py public_suffix.py history_log.py history_cli.py health_cli.py scripts tests
      - name: Tests
        run: python -m unittest discover -s tests -v
  static-security-lint:
    name: undefined names and dangerous execution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Ruff
        run: |
          python3 -m pip install --only-binary=:all: 'ruff==0.17.1'
      - name: Check undefined names and unsafe dynamic execution
        run: ruff check --select F821,F822,F823,S307,S602 .

  nft-syntax:
    name: nftables syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install nftables
        run: sudo apt-get update && sudo apt-get install -y nftables
      - name: Validate generated guard rules without applying them
        run: |
          python3 -c "from scripts.crawler_egress_guard import rules; print(rules('br-localcheck'))" > /tmp/local-search-mcp-guard.nft
          sudo nft --check --file /tmp/local-search-mcp-guard.nft
  systemd-unit-syntax:
    name: systemd user unit syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated user units
        run: |
          UNIT_DIR="$(mktemp -d)"
          export UNIT_DIR
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.install_user_services import unit_files
          folder = Path(os.environ['UNIT_DIR'])
          reflog = folder / 'head.log'
          reflog.touch()
          for name, contents in unit_files('/usr/bin/python3', Path.cwd(),
                                           auto_restart=True, reflog_path=reflog).items():
              (folder / name).write_text(contents)
          PY
          SYSTEMD_UNIT_PATH="$UNIT_DIR:/usr/lib/systemd/system:/lib/systemd/system" systemd-analyze verify "$UNIT_DIR"/*.service "$UNIT_DIR"/*.timer "$UNIT_DIR"/*.path
          mkdir -p "$UNIT_DIR/local-search-mcp-tunnel.service.d"
          cp config/systemd/guards/10-crawler-egress.conf "$UNIT_DIR/local-search-mcp-tunnel.service.d/10-crawler-egress.conf"
          cp config/systemd-system/local-search-mcp-crawler-egress.service "$UNIT_DIR/"
          sudo install -D -m 0755 scripts/crawler_egress_guard.py /usr/local/libexec/local-search-mcp/crawler_egress_guard.py
          SYSTEMD_UNIT_PATH="$UNIT_DIR:/usr/lib/systemd/system:/lib/systemd/system" systemd-analyze verify "$UNIT_DIR/local-search-mcp-tunnel.service" "$UNIT_DIR/local-search-mcp-crawler-egress.service"

  crawler-compose-syntax:
    name: generated crawler Compose syntax
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate private scaffold with Docker Compose
        run: |
          tmp="$(mktemp -d)"
          chmod 700 "$tmp"
          export CRAWLER_COMPOSE_TEST_DIR="$tmp"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.crawler_compose import generate
          folder = generate(Path(os.environ["CRAWLER_COMPOSE_TEST_DIR"]),
                            image="unclecode/crawl4ai:0.9.5", token="test-only-value")
          from scripts.install_searxng_compose import install
          install(folder)
          PY
          docker compose --project-directory "$tmp/crawler-compose" \
            -f "$tmp/crawler-compose/compose.yaml" \
            -f "$tmp/crawler-compose/searxng.compose.yaml" config --quiet
          # Exercise the actual Docker Compose image-only output, not just
          # mocked subprocess output in unit tests.
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.check_compose_image_pins import report
          folder = Path(os.environ["CRAWLER_COMPOSE_TEST_DIR"]) / "crawler-compose"
          status = report(folder)
          assert status["image_count"] == 2
          assert not status["all_digest_pinned"]
          PY
